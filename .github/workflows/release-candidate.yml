name: Release Candidate

on:
  push:
    branches:
      - dev
    paths-ignore:
      # Skill-library docs (.claude/skills/**) ship in the repo, not in the app.
      # A push that touches only skills should not spend a full RC build
      # (test + Windows installer). A mixed push (skills + real code) still
      # triggers normally.
      - '.claude/skills/**'

permissions:
  contents: write

concurrency:
  # A newer dev push cancels whichever RC build is still running for this ref.
  group: rc-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Test Rust core
        run: npm test

  build-rc:
    name: Build and Publish Release Candidate
    # Gate the installer on the test job: never publish an RC that does not build/pass.
    needs: check
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # One rolling RC: delete the previous `rc` release and its tag so the next
      # step can recreate them pointing at the latest dev commit.
      - name: Delete existing RC release and tag
        shell: bash
        run: gh release delete rc --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build installer and publish RC
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: rc
          releaseName: "ProjectLog RC"
          releaseBody: "Latest release candidate — built from commit ${{ github.sha }}. Pre-release, not for production use."
          releaseDraft: false
          prerelease: true

name: Release

# A push to master publishes a stable, tagged release from package.json's version.
# master is release-only (see ARCHITECTURE.md): it changes only when shipping.
# Release candidates are a separate, automatic pipeline on dev (release-candidate.yml),
# and the website is deployed by pages.yml. This workflow does neither.

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      already_released: ${{ steps.exists.outputs.already_released }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci

      - name: Require a stable version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "$VERSION" == *-* ]]; then
            echo "::error::master publishes a stable release, but package.json version is '$VERSION'. Bump to a clean MAJOR.MINOR.PATCH (no prerelease suffix) before merging to master."
            exit 1
          fi

      - name: Check version sync
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          TAURI_VERSION="$(node - <<'NODE'
          const conf = require("./src-tauri/tauri.conf.json");
          if (typeof conf.version === "string" && /^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(conf.version)) {
            console.log(conf.version);
          } else if (conf.version === "../package.json") {
            console.log(require("./package.json").version);
          } else {
            throw new Error(`Unsupported tauri.conf.json version value: ${conf.version}`);
          }
          NODE
          )"
          if [[ "${PACKAGE_VERSION}" != "${TAURI_VERSION}" ]]; then
            echo "::error::package.json (${PACKAGE_VERSION}) and tauri.conf.json (${TAURI_VERSION}) versions differ."
            exit 1
          fi

      - name: Skip if this version is already released
        id: exists
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if gh release view "v${VERSION}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "already_released=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Release v${VERSION} already exists; nothing to publish. Bump the version to ship again."
          else
            echo "already_released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build frontend
        run: npm run build

      - name: Release metadata
        id: meta
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${VERSION}" >> "${GITHUB_OUTPUT}"

  build-windows:
    name: Build Windows Installer and Publish Release
    needs: validate
    if: ${{ needs.validate.outputs.already_released != 'true' }}
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Test Rust core
        run: cargo test
        working-directory: src-tauri

      - name: Prepare release body from CHANGELOG
        id: release_body
        shell: bash
        run: |
          {
            echo 'body<<RELEASE_BODY_EOF'
            cat CHANGELOG.md
            echo 'RELEASE_BODY_EOF'
          } >> "$GITHUB_OUTPUT"

      # A stable release supersedes the rolling release candidate; remove it.
      - name: Remove the rolling release candidate
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete rc --repo "${{ github.repository }}" --cleanup-tag --yes || true

      - name: Build installer and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.validate.outputs.tag }}
          releaseName: "ProjectLog ${{ needs.validate.outputs.tag }}"
          releaseBody: ${{ steps.release_body.outputs.body }}
          releaseDraft: false
          prerelease: false

name: Deploy Website

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy-pages:
    name: Deploy Website
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate website
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          mkdir -p docs
          cat > docs/index.html <<EOF
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>ProjectLog</title>
              <style>
                body { margin: 0; font-family: system-ui, sans-serif; color: #20241f; background: #f4f5f1; }
                main { max-width: 720px; margin: 0 auto; padding: 64px 24px; }
                h1 { font-size: 36px; margin: 0 0 8px; }
                p { font-size: 17px; line-height: 1.55; color: #495047; }
                a { color: #267a62; font-weight: 650; }
              </style>
            </head>
            <body>
              <main>
                <h1>ProjectLog</h1>
                <p>Current version: <strong>${VERSION}</strong></p>
                <p>No-nonsense project time tracking for Cockpit timesheets.</p>
                <p><a href="https://github.com/kargaen/projectlog/releases/latest">Download the latest release</a></p>
                <p><a href="./privacy.html">Privacy policy</a></p>
              </main>
            </body>
          </html>
          EOF
          cat > docs/privacy.html <<EOF
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>Privacy Policy</title>
              <style>
                body { margin: 0; font-family: system-ui, sans-serif; color: #20241f; background: #f4f5f1; }
                main { max-width: 760px; margin: 0 auto; padding: 64px 24px; }
                h1 { font-size: 36px; margin: 0 0 12px; }
                h2 { font-size: 22px; margin: 32px 0 8px; }
                p, li { font-size: 17px; line-height: 1.6; color: #495047; }
                a { color: #267a62; font-weight: 650; }
              </style>
            </head>
            <body>
              <main>
                <p><a href="./">ProjectLog</a></p>
                <h1>Privacy Policy</h1>
                <p>This privacy policy applies to desktop applications published by Karsten Garborg unless a project states otherwise.</p>

                <h2>What these apps store</h2>
                <p>These apps may store user-entered content and application settings locally on the user's device in order to provide their core functionality. Depending on the project, this may include items such as project names, comments, preferences, window state, and local logs.</p>

                <h2>What these apps do not do</h2>
                <p>These apps do not intentionally collect, sell, or share personal data with the developer or third parties for analytics, advertising, profiling, or tracking.</p>

                <h2>External services</h2>
                <p>If a user chooses features that open external services, the user's device may connect directly to those services. Examples may include GitHub repository and release pages, email links, and application update endpoints. Those third-party services operate under their own terms and privacy policies.</p>

                <h2>Updates</h2>
                <p>Some apps may check for and download updates from GitHub-hosted release endpoints or other clearly identified release infrastructure. This network activity is used only to provide update functionality.</p>

                <h2>Contact</h2>
                <p>Questions about privacy for these projects can be directed to <a href="mailto:karga@karga.dk">karga@karga.dk</a>.</p>
              </main>
            </body>
          </html>
          EOF

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
